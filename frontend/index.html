  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ultimate administrative dashboard and real-time quota monitor watchlist for Bogazici University Course Registration schedules." />
    <title>Ultimate BOUN: Registration Scraper & Watcher Dashboard</title>
    <script>
      // Automatically recover from version skew / stale cached asset hashes across rolling deployments
      window.addEventListener('error', function(e) {
        var el = e.target;
        if (el && (el.tagName === 'LINK' || el.tagName === 'SCRIPT')) {
          var src = el.href || el.src;
          if (src && src.indexOf('/assets/') !== -1) {
            var key = 'asset_retry_' + src;
            if (!sessionStorage.getItem(key)) {
              sessionStorage.setItem(key, '1');
              window.location.reload();
            }
          }
        }
      }, true);
    </script>
    <script defer src="https://umami.bogazici.app/script.js" data-website-id="1ce4ac76-d796-495d-8a9f-d51c982f230b"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
