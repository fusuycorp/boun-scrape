name: Build & Deploy to Dokploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: registry.bogazici.app
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: registry.bogazici.app/budok/boun-scrape-backend:latest
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,push=true,compression=gzip,compression-level=9,force-compression=true

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: registry.bogazici.app/budok/boun-scrape-frontend:latest
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,push=true,compression=gzip,compression-level=9,force-compression=true

      - name: Trigger Dokploy Redeployment
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY || secrets.DOKPLOY_KEY }}
        run: |
          curl -s -X POST "https://dokploy.bogazici.app/api/compose.redeploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"composeId": "Y1y6n7j5USm8MF4kHRuAe"}'
