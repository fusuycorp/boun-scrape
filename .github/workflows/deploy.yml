name: Build & Deploy to Dokploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: registry.bogazici.app
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: registry.bogazici.app/budok/boun-scrape-backend:latest
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,push=true,compression=gzip,compression-level=9,force-compression=true

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: registry.bogazici.app/budok/boun-scrape-frontend:latest
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,push=true,compression=gzip,compression-level=9,force-compression=true

      - name: Trigger Dokploy Redeployment
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY || secrets.DOKPLOY_KEY }}
          DOKPLOY_COMPOSE_ID: "Y1y6n7j5USm8MF4kHRuAe"
        run: |
          if [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::error::DOKPLOY_API_KEY (or DOKPLOY_KEY) secret is not configured."
            exit 1
          fi

          # Attempt 1: standard REST API
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://dokploy.bogazici.app/api/compose.redeploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Dokploy redeployment triggered via REST API (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 0
          fi
          echo "Attempt 1 returned HTTP $HTTP_CODE: $BODY"
          echo "Attempt 2: trying tRPC-wrapped payload..."

          # Attempt 2: tRPC-wrapped payload (some Dokploy routes require this shape)
          TRPC_RESP=$(curl -s -w "\n%{http_code}" -X POST "https://dokploy.bogazici.app/api/compose.redeploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"json\": {\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}}")
          TRPC_CODE=$(echo "$TRPC_RESP" | tail -n 1)
          TRPC_BODY=$(echo "$TRPC_RESP" | sed '$d')

          if [ "$TRPC_CODE" -ge 200 ] && [ "$TRPC_CODE" -lt 300 ]; then
            echo "✅ Dokploy redeployment triggered via tRPC API (HTTP $TRPC_CODE)"
            echo "$TRPC_BODY"
            exit 0
          fi

          echo "::error::All Dokploy redeploy attempts failed."
          echo "REST API (HTTP $HTTP_CODE): $BODY"
          echo "tRPC API (HTTP $TRPC_CODE): $TRPC_BODY"
          exit 1
