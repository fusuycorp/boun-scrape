name: Build & Deploy to Dokploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: registry.bogazici.app
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: registry.bogazici.app/budok/boun-scrape-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: registry.bogazici.app/budok/boun-scrape-frontend:latest

      - name: Trigger Dokploy Redeployment
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY || secrets.DOKPLOY_KEY }}
        run: |
          curl -s -X POST "https://dokploy.bogazici.app/api/compose.redeploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"composeId": "Y1y6n7j5USm8MF4kHRuAe"}'
